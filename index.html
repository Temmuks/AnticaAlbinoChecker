<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Antica — World Status</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --stone-0: #0f0d0a;
      --stone-1: #191510;
      --stone-2: #241e16;
      --stone-3: #3a3124;
      --gold: #c9a227;
      --gold-dim: #8a6f21;
      --parchment: #e9dfc6;
      --muted: #9c9280;
      --moss: #5a8a52;
      --moss-dim: #2c3f26;
      --ember: #b23a2e;
      --ember-dim: #3f1f1a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background:
        var(--stone-0);
      color: var(--parchment);
      font-family: 'Spectral', Georgia, serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    .frame {
      margin: 10vh;
      width: 100%;
      max-width: 560px;
      border: 1px solid var(--stone-3);
      background: var(--stone-1);
      padding: 2px;
    }

    .frame-inner {
      border: 1px solid var(--gold-dim);
      padding: 44px 40px 36px;
      position: relative;
    }

    .corner {
      position: absolute;
      width: 14px;
      height: 14px;
      border: 2px solid var(--gold);
    }

    .corner.tl {
      top: -2px;
      left: -2px;
      border-right: none;
      border-bottom: none;
    }

    .corner.tr {
      top: -2px;
      right: -2px;
      border-left: none;
      border-bottom: none;
    }

    .corner.bl {
      bottom: -2px;
      left: -2px;
      border-right: none;
      border-top: none;
    }

    .corner.br {
      bottom: -2px;
      right: -2px;
      border-left: none;
      border-top: none;
    }

    .eyebrow {
      font-family: 'Cinzel', serif;
      font-size: 12px;
      letter-spacing: 0.18em;
      color: var(--muted);
      text-align: center;
      margin: 0 0 6px;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 34px;
      text-align: center;
      margin: 0 0 30px;
      color: var(--gold);
      letter-spacing: 0.04em;
    }

        h2 {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 34px;
      text-align: center;
      margin: 0 0 30px;
      color: var(--gold);
      letter-spacing: 0.04em;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 22px 0;
      border-top: 1px solid var(--stone-3);
      border-bottom: 1px solid var(--stone-3);
      margin-bottom: 26px;
    }

    .dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }

    .dot.online {
      background: var(--moss);
      box-shadow: 0 0 0 4px var(--moss-dim);
    }

    .dot.offline {
      background: var(--ember);
      box-shadow: 0 0 0 4px var(--ember-dim);
    }

    .dot.pending {
      background: var(--gold);
      box-shadow: 0 0 0 4px #4a3c14;
      animation: pulse 1.4s ease-in-out infinite;
    }

    .dot.idle {
      background: var(--moss);
      box-shadow: 0 0 0 4px var(--moss-dim);
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.35;
      }
    }

    .status-text {
      font-family: 'Cinzel', serif;
      font-size: 22px;
      letter-spacing: 0.1em;
      font-weight: 600;
    }

    .status-text.online {
      color: var(--moss);
    }

    .status-text.offline {
      color: var(--ember);
    }

    .status-text.pending {
      color: var(--gold);
    }

    .status-text.idle {
      color: var(--parchment);
    }

    .field {
      text-align: center;
      margin-bottom: 22px;
    }

    .field-label {
      font-size: 13px;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 0 0 6px;
      font-style: italic;
    }

    .field-value {
      font-size: 26px;
      color: var(--parchment);
      letter-spacing: 0.03em;
      font-variant-numeric: tabular-nums;
    }

    .field-value.empty {
      color: var(--muted);
      font-size: 16px;
      font-style: italic;
    }

    .divider {
      text-align: center;
      color: var(--gold-dim);
      margin: 22px 0;
      font-size: 13px;
      letter-spacing: 0.3em;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--muted);
      margin-top: 26px;
      padding-top: 16px;
      border-top: 1px solid var(--stone-3);
    }

    .meta span:last-child {
      color: var(--parchment);
    }

    .error-box {
      text-align: center;
      color: var(--ember);
      font-size: 13px;
      font-style: italic;
      margin-top: 18px;
    }

    img {

      min-width: 20vh;
      max-width: 20vh;
    }
  </style>
</head>

<body>

  <div class="frame">
    <div class="frame-inner">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
    <h1 >Todays boosted boss</h1>
    <div class="status-row">
      <h2 class="status-text idle" id="boostedBossName"></h2>
    </div>
    <img id="boostedBossImage">
    </div>
  </div>

  <div class="frame">
    <div class="frame-inner">

      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>

      <p class="eyebrow">Tibia world watch</p>

      <h1>Antica</h1>

      <div class="status-row">
        <div class="dot pending" id="dot"></div>
        <div class="status-text pending" id="statusText">
          Checking…
        </div>
      </div>

      <div class="field">
        <p class="field-label">Came online at</p>
        <div class="field-value empty" id="transitionTime">
          No transition observed yet
        </div>
      </div>

      <div class="divider">✦</div>

      <div class="field">
        <p class="field-label">Players online</p>
        <div class="field-value" id="playersOnline">—</div>
      </div>

      <div class="meta">
        <span>Last status check</span>
        <span id="lastChecked">—</span>
      </div>

      <div class="meta">
        <span>Status window</span>
        <span>09:55–10:20 CEST</span>
      </div>

      <div class="meta">
        <span>Players updated</span>
        <span id="lastPlayersUpdate">—</span>
      </div>

      <div
        class="error-box"
        id="errorBox"
        style="display:none;"
      ></div>

    </div>
  </div>

  <div class="frame">
    <div class="frame-inner">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
    <h2 >Next Albino drake spawn</h2>
    <div class="status-row">
      <h3 class="status-text idle" id="albino-spawn-time"></h3>
    </div>
    <img id="albino">
    </div>
  </div>

  <script>

const albinoSpawnTimeEl = document.getElementById('albino-spawn-time');
const albinoImgEl = document.getElementById('albino');

if (albinoImgEl) {
  albinoImgEl.src = "https://static.wikia.nocookie.net/tibia/images/0/06/Albino_Dragon.gif/revision/latest?cb=20231010124222&path-prefix=en&format=original"; // Example image URL
  albinoImgEl.alt = "Albino Drake";
}

    const WORLD = "Antica";

    const boostedBossName = document.getElementById("boostedBossName");

    const boostedBossImage = document.getElementById("boostedBossImage");

    const API_URL =
      "https://api.tibiadata.com/v4/world/" + WORLD;

      const API_BOOSTED_BOSS = "https://api.tibiadata.com/v4/boostablebosses"

    let transitionDate = null;

    const dot = document.getElementById('dot');
    const statusText = document.getElementById('statusText');
    const transitionTimeEl =
      document.getElementById('transitionTime');
    const playersOnlineEl =
      document.getElementById('playersOnline');
    const lastCheckedEl =
      document.getElementById('lastChecked');
    const lastPlayersUpdateEl =
      document.getElementById('lastPlayersUpdate');
    const errorBox =
      document.getElementById('errorBox');


    function formatClock(date) {
      const h = String(date.getHours()).padStart(2, '0');
      const m = String(date.getMinutes()).padStart(2, '0');
      const s = String(date.getSeconds()).padStart(2, '0');

      return h + ':' + m + ':' + s;
    }


    function setStatusUI(state) {
      dot.className = 'dot ' + state;
      statusText.className = 'status-text ' + state;

      if (state === 'online') {
        statusText.textContent = 'Online';
      } else if (state === 'offline') {
        statusText.textContent = 'Offline';
      } else {
        statusText.textContent = 'Checking…';
      }
    }


    async function fetchBoss() {
      try {
        const res = await fetch(API_BOOSTED_BOSS);
        const data = await res.json();
        const boss = data.boostable_bosses.boosted;

        boostedBossName.textContent = boss.name;
        boostedBossImage.src = boss.image_url;
        boostedBossImage.alt = boss.name;
      } catch (err) {
        console.error('Could not load boosted boss', err);
      }
    }


    function albinoSpawn() {
      if (!transitionDate || !albinoSpawnTimeEl) return;

      const now = new Date();

      // First spawn occurs 10 minutes after the server came online
      let nextSpawn = new Date(transitionDate.getTime() + 10 * 60 * 1000);

      // Subsequent spawns repeat every 30 minutes
      while (nextSpawn <= now) {
        nextSpawn = new Date(nextSpawn.getTime() + 30 * 60 * 1000);
      }

      albinoSpawnTimeEl.textContent = formatClock(nextSpawn);
    }


    async function fetchWorld() {
      const res = await fetch(API_URL, {
        cache: 'no-store'
      });

      if (!res.ok) {
        throw new Error('HTTP ' + res.status);
      }

      const data = await res.json();
      const world = data && data.world;

      if (!world) {
        throw new Error('Unexpected response shape');
      }

      return world;
    }


    /*
     * Live status check — shows the CURRENT status whenever
     * someone has the page open. This does NOT try to detect
     * the offline->online transition anymore; that's handled
     * by the GitHub Actions workflow and data/status.json.
     */
    async function checkStatus() {
      try {
        const world = await fetchWorld();

        const rawStatus =
          (world.status || '').toLowerCase();

        const isOnline =
          rawStatus.includes('online') &&
          !rawStatus.includes('offline');

        setStatusUI(isOnline ? 'online' : 'offline');

        lastCheckedEl.textContent =
          formatClock(new Date());

        errorBox.style.display = 'none';

      } catch (err) {
        errorBox.style.display = 'block';

        errorBox.textContent =
          'Could not reach the world status service. Retrying…';

        lastCheckedEl.textContent =
          formatClock(new Date());
      }
    }


    async function updatePlayerCount() {
      try {
        const world = await fetchWorld();

        const rawStatus =
          (world.status || '').toLowerCase();

        const isOnline =
          rawStatus.includes('online') &&
          !rawStatus.includes('offline');

        const playerCount =
          world.players_online ??
          world.record_players ??
          world.playersOnline ??
          null;


        if (
          isOnline &&
          playerCount !== null &&
          playerCount !== undefined
        ) {
          playersOnlineEl.textContent = playerCount;
          playersOnlineEl.classList.remove('empty');

        } else if (isOnline) {
          playersOnlineEl.textContent = 'Unavailable';
          playersOnlineEl.classList.add('empty');

        } else {
          playersOnlineEl.textContent = '—';
          playersOnlineEl.classList.add('empty');
        }


        lastPlayersUpdateEl.textContent =
          formatClock(new Date());

      } catch (err) {
        lastPlayersUpdateEl.textContent =
          formatClock(new Date());
      }
    }


    /*
     * Load the transition time recorded by the GitHub Actions
     * workflow (data/status.json in this same repo). This is
     * what makes "came online at" and the albino spawn time
     * work even if nobody was viewing the page during the
     * 09:55–10:20 window.
     */
    async function loadTransitionFromRepo() {
      try {
        const res = await fetch('data/status.json', { cache: 'no-store' });
        if (!res.ok) return;

        const data = await res.json();
        if (data.transitionDate) {
          transitionDate = new Date(data.transitionDate);
          transitionTimeEl.textContent = formatClock(transitionDate);
          transitionTimeEl.classList.remove('empty');
          albinoSpawn();
        }
      } catch (err) {
        console.error('Could not load status.json', err);
      }
    }


    // Initial loads
    checkStatus();
    updatePlayerCount();
    loadTransitionFromRepo();
    fetchBoss();

    // Ongoing refresh intervals
    setInterval(checkStatus, 60 * 1000);          // live status every minute
    setInterval(updatePlayerCount, 10 * 60 * 1000); // players every 10 min
    setInterval(fetchBoss, 60 * 1000);              // boosted boss every minute
    setInterval(albinoSpawn, 60 * 1000);            // recompute spawn countdown

  </script>

</body>

</html>
