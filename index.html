
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Antica — World Status</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --stone-0: #0f0d0a;
      --stone-1: #191510;
      --stone-2: #241e16;
      --stone-3: #3a3124;
      --gold: #c9a227;
      --gold-dim: #8a6f21;
      --parchment: #e9dfc6;
      --muted: #9c9280;
      --moss: #5a8a52;
      --moss-dim: #2c3f26;
      --ember: #b23a2e;
      --ember-dim: #3f1f1a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background:
        var(--stone-0);
      color: var(--parchment);
      font-family: 'Spectral', Georgia, serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    .frame {
      margin: 10vh;
      width: 100%;
      max-width: 560px;
      border: 1px solid var(--stone-3);
      background: var(--stone-1);
      padding: 2px;
    }

    .frame-inner {
      border: 1px solid var(--gold-dim);
      padding: 44px 40px 36px;
      position: relative;
    }

    .corner {
      position: absolute;
      width: 14px;
      height: 14px;
      border: 2px solid var(--gold);
    }

    .corner.tl {
      top: -2px;
      left: -2px;
      border-right: none;
      border-bottom: none;
    }

    .corner.tr {
      top: -2px;
      right: -2px;
      border-left: none;
      border-bottom: none;
    }

    .corner.bl {
      bottom: -2px;
      left: -2px;
      border-right: none;
      border-top: none;
    }

    .corner.br {
      bottom: -2px;
      right: -2px;
      border-left: none;
      border-top: none;
    }

    .eyebrow {
      font-family: 'Cinzel', serif;
      font-size: 12px;
      letter-spacing: 0.18em;
      color: var(--muted);
      text-align: center;
      margin: 0 0 6px;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 34px;
      text-align: center;
      margin: 0 0 30px;
      color: var(--gold);
      letter-spacing: 0.04em;
    }

        h2 {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 34px;
      text-align: center;
      margin: 0 0 30px;
      color: var(--gold);
      letter-spacing: 0.04em;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 22px 0;
      border-top: 1px solid var(--stone-3);
      border-bottom: 1px solid var(--stone-3);
      margin-bottom: 26px;
    }

    .dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }

    .dot.online {
      background: var(--moss);
      box-shadow: 0 0 0 4px var(--moss-dim);
    }

    .dot.offline {
      background: var(--ember);
      box-shadow: 0 0 0 4px var(--ember-dim);
    }

    .dot.pending {
      background: var(--gold);
      box-shadow: 0 0 0 4px #4a3c14;
      animation: pulse 1.4s ease-in-out infinite;
    }

    .dot.idle {
      background: var(--moss);
      box-shadow: 0 0 0 4px var(--moss-dim);
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.35;
      }
    }

    .status-text {
      font-family: 'Cinzel', serif;
      font-size: 22px;
      letter-spacing: 0.1em;
      font-weight: 600;
    }

    .status-text.online {
      color: var(--moss);
    }

    .status-text.offline {
      color: var(--ember);
    }

    .status-text.pending {
      color: var(--gold);
    }

    .status-text.idle {
      color: var(--parchment);
    }

    .field {
      text-align: center;
      margin-bottom: 22px;
    }

    .field-label {
      font-size: 13px;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 0 0 6px;
      font-style: italic;
    }

    .field-value {
      font-size: 26px;
      color: var(--parchment);
      letter-spacing: 0.03em;
      font-variant-numeric: tabular-nums;
    }

    .field-value.empty {
      color: var(--muted);
      font-size: 16px;
      font-style: italic;
    }

    .divider {
      text-align: center;
      color: var(--gold-dim);
      margin: 22px 0;
      font-size: 13px;
      letter-spacing: 0.3em;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--muted);
      margin-top: 26px;
      padding-top: 16px;
      border-top: 1px solid var(--stone-3);
    }

    .meta span:last-child {
      color: var(--parchment);
    }

    .error-box {
      text-align: center;
      color: var(--ember);
      font-size: 13px;
      font-style: italic;
      margin-top: 18px;
    }

    img {

      min-width: 20vh;
      max-width: 20vh;
    }
  </style>
</head>

<body>

  <div class="frame">
    <div class="frame-inner">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
    <h1 >Todays boosted boss</h1>
    <div class="status-row">
      <h2 class="status-text idle" id="boostedBossName"></h2>
    </div>
    <img id="boostedBossImage">
    </div>
  </div>

  <div class="frame">
    <div class="frame-inner">

      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>

      <p class="eyebrow">Tibia world watch</p>

      <h1>Antica</h1>

      <div class="status-row">
        <div class="dot pending" id="dot"></div>
        <div class="status-text pending" id="statusText">
          Checking…
        </div>
      </div>

      <div class="field">
        <p class="field-label">Came online at</p>
        <div class="field-value empty" id="transitionTime">
          No transition observed yet
        </div>
      </div>

      <div class="divider">✦</div>

      <div class="field">
        <p class="field-label">Players online</p>
        <div class="field-value" id="playersOnline">—</div>
      </div>

      <div class="meta">
        <span>Last status check</span>
        <span id="lastChecked">—</span>
      </div>

      <div class="meta">
        <span>Status window</span>
        <span>09:55–10:20 CEST</span>
      </div>

      <div class="meta">
        <span>Players updated</span>
        <span id="lastPlayersUpdate">—</span>
      </div>

      <div
        class="error-box"
        id="errorBox"
        style="display:none;"
      ></div>

    </div>
  </div>

  <div class="frame">
    <div class="frame-inner">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
    <h2 >Next Albino drake spawn</h2>
    <div class="status-row">
      <h3 class="status-text idle" id="albino-spawn-time"></h3>
    </div>
    <img id="albino">
    </div>
  </div>

  <script>

const albinoSpawnTimeEl = document.getElementById('albino-spawn-time');
const albinoImgEl = document.getElementById('albino');

if (albinoImgEl) {
  albinoImgEl.src = "https://static.wikia.nocookie.net/tibia/images/0/06/Albino_Dragon.gif/revision/latest?cb=20231010124222&path-prefix=en&format=original"; // Example image URL
  albinoImgEl.alt = "Albino Drake";
}

    const WORLD = "Antica";

    const boostedBossName = document.getElementById("boostedBossName");

    const boostedBossImage = document.getElementById("boostedBossImage");

    const API_URL =
      "https://api.tibiadata.com/v4/world/" + WORLD;

      const API_BOOSTED_BOSS = "https://api.tibiadata.com/v4/boostablebosses"


    // Monitoring window: 09:55–10:20 Europe/Stockholm time.
    const WINDOW_START_MIN = 9 * 60 + 55;
    const WINDOW_END_MIN = 10 * 60 + 20;

    // Player count is updated every 10 minutes.
    const PLAYERS_INTERVAL_MS = 10 * 60 * 1000;

    let previousStatus = null;
    let transitionDate = null;
    let wasWindowActive = false;

    const dot = document.getElementById('dot');
    const statusText = document.getElementById('statusText');
    const transitionTimeEl =
      document.getElementById('transitionTime');
    const playersOnlineEl =
      document.getElementById('playersOnline');
    const lastCheckedEl =
      document.getElementById('lastChecked');
    const lastPlayersUpdateEl =
      document.getElementById('lastPlayersUpdate');
    const errorBox =
      document.getElementById('errorBox');


    function formatClock(date) {
      const h = String(date.getHours()).padStart(2, '0');
      const m = String(date.getMinutes()).padStart(2, '0');
      const s = String(date.getSeconds()).padStart(2, '0');

      return h + ':' + m + ':' + s;
    }


    /*
     * Get the current time in the Europe/Stockholm timezone.
     *
     * This automatically handles CET/CEST daylight-saving
     * changes instead of using a fixed UTC offset.
     */
    function stockholmMinutesOfDay(date) {
      const fmt = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Europe/Stockholm',
        hour12: false,
        hour: '2-digit',
        minute: '2-digit'
      });

      const parts = fmt.formatToParts(date);

      const hour = parseInt(
        parts.find(p => p.type === 'hour').value,
        10
      );

      const minute = parseInt(
        parts.find(p => p.type === 'minute').value,
        10
      );

      return hour * 60 + minute;
    }


    function isWithinWindow(date) {
      const minutesNow = stockholmMinutesOfDay(date);

      return (
        minutesNow >= WINDOW_START_MIN &&
        minutesNow <= WINDOW_END_MIN
      );
    }


    function setStatusUI(state) {
      dot.className = 'dot ' + state;
      statusText.className = 'status-text ' + state;

      if (state === 'online') {
        statusText.textContent = 'Online';
      } else if (state === 'offline') {
        statusText.textContent = 'Offline';
      } else if (state === 'idle') {
        statusText.textContent =
          'Online';
      } else {
        statusText.textContent = 'Checking…';
      }
    }


    async function fetchBoss() {
      const res = await fetch(API_BOOSTED_BOSS)

      const data = await res.json();

    const boss = data.boostable_bosses.boosted;

    boostedBossName.textContent = boss.name;
    boostedBossImage.src = boss.image_url;
    boostedBossImage.alt = boss.name;
    }
 
function albinoSpawn() {
  if (!transitionDate || !albinoSpawnTimeEl) return;

  const now = new Date();
  
  // First spawn occurs 10 minutes after server comes online
  let nextSpawn = new Date(transitionDate.getTime() + 10 * 60 * 1000);

  // Subsequent spawns repeat every 30 minutes
  while (nextSpawn <= now) {
    nextSpawn = new Date(nextSpawn.getTime() + 30 * 60 * 1000);
  }

  // Display the next calculated spawn time
  albinoSpawnTimeEl.textContent = formatClock(nextSpawn);
}

    async function fetchWorld() {
      const res = await fetch(API_URL, {
        cache: 'no-store'
      });

      if (!res.ok) {
        throw new Error('HTTP ' + res.status);
      }

      const data = await res.json();
      const world = data && data.world;

      if (!world) {
        throw new Error('Unexpected response shape');
      }

      return world;
    }


    /*
     * Check the world status.
     *
     * This function is called once every second while the
     * monitoring window is active.
     */
    async function checkStatus() {
      try {
        const world = await fetchWorld();

        const rawStatus =
          (world.status || '').toLowerCase();

        const isOnline =
          rawStatus.includes('online') &&
          !rawStatus.includes('offline');

        const currentState =
          isOnline ? 'online' : 'offline';


        /*
         * Detect the exact moment the world changes
         * from offline to online.
         */
        if (
          previousStatus === 'offline' &&
          currentState === 'online'
        ) {
          transitionDate = new Date();

          transitionTimeEl.textContent =
            formatClock(transitionDate);

          transitionTimeEl.classList.remove('empty');
        }

        albinoSpawn();

        fetchBoss();

        setInterval(fetchBoss, 60 * 1000);

        setInterval(albinoSpawn, 60 * 1000);

        previousStatus = currentState;

        setStatusUI(currentState);

        lastCheckedEl.textContent =
          formatClock(new Date());

        errorBox.style.display = 'none';

      } catch (err) {
        errorBox.style.display = 'block';

        errorBox.textContent =
          'Could not reach the world status service. Retrying…';

        lastCheckedEl.textContent =
          formatClock(new Date());
      }
    }


    async function updatePlayerCount() {
      try {
        const world = await fetchWorld();

        const rawStatus =
          (world.status || '').toLowerCase();

        const isOnline =
          rawStatus.includes('online') &&
          !rawStatus.includes('offline');

        const playerCount =
          world.players_online ??
          world.record_players ??
          world.playersOnline ??
          null;


        if (
          isOnline &&
          playerCount !== null &&
          playerCount !== undefined
        ) {
          playersOnlineEl.textContent = playerCount;
          playersOnlineEl.classList.remove('empty');

        } else if (isOnline) {
          playersOnlineEl.textContent = 'Unavailable';
          playersOnlineEl.classList.add('empty');

        } else {
          playersOnlineEl.textContent = '—';
          playersOnlineEl.classList.add('empty');
        }


        lastPlayersUpdateEl.textContent =
          formatClock(new Date());

      } catch (err) {
        lastPlayersUpdateEl.textContent =
          formatClock(new Date());
      }
    }


    /*
     * Runs every second.
     *
     * During 09:55–10:20 CEST:
     *   → checkStatus() runs every second.
     *
     * Outside that window:
     *   → no status API requests are made.
     */

function tick() {
  const now = new Date();
  const active = isWithinWindow(now);

  /*
   * When entering the monitoring window, keep the
   * previous status established by the launch-time check.
   *
   * If no status has been checked yet, the first
   * second inside the window will establish it.
   */
  if (active && !wasWindowActive) {
    setStatusUI('pending');
  }

  /*
   * When leaving the monitoring window, return to
   * the idle state.
   */
  if (!active && wasWindowActive) {
    setStatusUI('idle');
  }

  wasWindowActive = active;

  /*
   * Check the API every second while the window
   * is active.
   */
  if (active) {
    checkStatus();
  } else {
    setStatusUI('idle');
  }
}


/*
 * FIRST CHECK:
 * Run immediately when the site launches,
 * regardless of the current time.
 */
checkStatus();


/*
 * Then run the window logic every second.
 */
setInterval(tick, 1000);


/*
 * Player count remains on the 10-minute schedule.
 */
updatePlayerCount();

setInterval(
  updatePlayerCount,
  PLAYERS_INTERVAL_MS
);




    /*
     * Run immediately on page load.
     */
    tick();


    /*
     * Run the monitoring tick every second.
     *
     * This means the status checker has a maximum
     * scheduling interval of approximately 1 second
     * during the 09:55–10:20 CEST window.
     */
    setInterval(tick, 1000);


    /*
     * Player count remains on the original 10-minute
     * update schedule.
     */
    updatePlayerCount();

    setInterval(
      updatePlayerCount,
      PLAYERS_INTERVAL_MS
    );

// TEST CONFIGURATION
// Replace this with any past time to simulate server boot:
// Example: Server came online 25 minutes ago
const now = new Date();
const TEST_ONLINE_TIME = new Date(
  now.getFullYear(),
  now.getMonth(),
  now.getDate(),
  10, // 10 AM
  15, // 15 minutes
  30  // 30 seconds
);

function testAlbinoSpawn() {
  // Hardcode the transition date for testing
  transitionDate = TEST_ONLINE_TIME;

  // Show the hardcoded time on the UI so you can verify
  if (transitionTimeEl) {
    transitionTimeEl.textContent = formatClock(transitionDate) + " (TEST)";
    transitionTimeEl.classList.remove('empty');
  }

  // Run the spawn calculation
  albinoSpawn();
}

// Call the test function directly
testAlbinoSpawn();


  </script>

</body>

</html>
