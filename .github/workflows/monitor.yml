name: Monitor Antica transition

on:
  schedule:
    # 07:40 UTC — script waits until 09:55 Stockholm time to start polling
    - cron: '40 7 * * *'
    # 08:40 UTC covers the CET (winter) offset
    - cron: '40 8 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Poll world status and record transition
        run: node scripts/monitor.mjs

      - name: Commit result
        run: |
          git config user.name "tibia-bot"
          git config user.email "actions@github.com"
          git add data/status.json
          git diff --quiet --cached || git commit -m "Update world status data"
          git push
